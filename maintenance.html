<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="shortcut icon" href="./image/logo.avif" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <title>بيعلي جملة | نعود قريباً</title>
    <style>
      :root {
        --indigo: #4f46e5;
        --indigo-dark: #3730a3;
        --slate-900: #1e293b;
        --slate-600: #475569;
        --slate-100: #f1f5f9;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--slate-900);
        background-color: var(--slate-100);
        background-image:
          linear-gradient(rgba(79, 70, 229, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(79, 70, 229, 0.045) 1px, transparent 1px);
        background-size: 32px 32px;
        font-family: "Tajawal", sans-serif;
        text-align: center;
        overflow: hidden;
      }

      .card {
        width: min(100%, 510px);
        padding: 38px 32px 34px;
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 70px rgba(30, 41, 59, 0.14);
        animation: appear 600ms ease both;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        margin-bottom: 30px;
        color: var(--indigo-dark);
        font-size: 20px;
        font-weight: 800;
      }

      .brand img {
        width: 46px;
        height: 46px;
        border-radius: 13px;
        object-fit: cover;
        box-shadow: 0 8px 18px rgba(79, 70, 229, 0.2);
      }

      .brand-icon {
        display: grid;
        width: 46px;
        height: 46px;
        place-items: center;
        border-radius: 13px;
        color: var(--indigo);
        background: #eef2ff;
        box-shadow: 0 8px 18px rgba(79, 70, 229, 0.2);
        font-size: 28px;
      }

      .status-icon {
        width: 82px;
        height: 82px;
        display: grid;
        place-items: center;
        margin: 0 auto 23px;
        border-radius: 50%;
        color: var(--indigo);
        background: #eef2ff;
        font-size: 38px;
      }

      h1 {
        margin-bottom: 13px;
        color: var(--slate-900);
        font-size: clamp(26px, 6vw, 34px);
        font-weight: 800;
        line-height: 1.25;
      }

      .lead {
        max-width: 390px;
        margin: 0 auto 22px;
        color: var(--slate-600);
        font-size: 16px;
        line-height: 1.9;
      }

      .note {
        display: inline-block;
        padding: 9px 15px;
        border-radius: 9px;
        color: var(--indigo-dark);
        background: #eef2ff;
        font-size: 14px;
        font-weight: 700;
      }

      .footer {
        margin-top: 29px;
        color: #94a3b8;
        font-size: 13px;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 420px) {
        body {
          padding: 16px;
        }
        .card {
          padding: 30px 21px 27px;
          border-radius: 20px;
        }
        .brand {
          margin-bottom: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">&#128722;</div>
        <span>متجر بيعلي جملة</span>
      </div>
      <div class="status-icon" aria-hidden="true">&#9881;</div>
      <h1>نجهّز لكم طلباتكم</h1>
      <p class="lead">
        نعمل على تأكيد الطلبات أو إلغائها وذلك بسبب ضغط الطلبات الكبير ، وتحديد
        إجمالي الكمية للطلب .
      </p>

      <div
        style="display: grid; gap: 12px; margin: 20px auto 0; max-width: 360px"
      >
        <button
          type="button"
          onclick="openQuickActionModal('confirm')"
          style="
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            border-radius: 12px;
            background: #dcfce7;
            color: #166534;
            font-weight: 800;
            font-size: 15px;
            padding: 12px 14px;
            cursor: pointer;
          "
        >
          <span>✓</span>
          <span>تأكيد الطلب</span>
        </button>
        <button
          type="button"
          onclick="openQuickActionModal('cancel')"
          style="
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            border-radius: 12px;
            background: #fee2e2;
            color: #991b1b;
            font-weight: 800;
            font-size: 15px;
            padding: 12px 14px;
            cursor: pointer;
          "
        >
          <span>✕</span>
          <span>إلغاء الطلب</span>
        </button>
      </div>

      <span class="note" style="margin-top: 24px">سنعود قريباً بإذن الله</span>
      <p class="footer">نشكركم على زيارتكم</p>
    </div>

    <div
      id="quickActionModal"
      style="
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.72);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 50;
      "
    >
      <div
        style="
          position: relative;
          width: min(100%, 420px);
          background: white;
          border-radius: 22px;
          box-shadow: 0 18px 48px rgba(15, 23, 42, 0.28);
          padding: 24px 20px 18px;
        "
      >
        <button
          type="button"
          onclick="closeQuickActionModal()"
          aria-label="إغلاق النافذة"
          style="
            position: absolute;
            top: -14px;
            left: -12px;
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: white;
            color: #0f172a;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.14);
            font-size: 18px;
            cursor: pointer;
          "
        >
          ×
        </button>

        <h2
          id="quickActionTitle"
          style="
            margin: 0 0 16px;
            font-size: 24px;
            color: #0f172a;
            text-align: center;
          "
        >
          تأكيد الطلب
        </h2>

        <form
          id="quickActionForm"
          onsubmit="submitQuickAction(event)"
          style="display: grid; gap: 14px"
        >
          <input id="quickActionType" type="hidden" value="confirm" />

          <div>
            <label
              for="quickActionPhone"
              style="
                display: block;
                margin-bottom: 6px;
                color: #334155;
                font-size: 13px;
                font-weight: 700;
              "
            >
              رقم الهاتف <span style="color: #ef4444">*</span>
            </label>
            <input
              id="quickActionPhone"
              type="tel"
              required
              minlength="11"
              maxlength="11"
              pattern="01(0|1|2|5)[0-9]{8}"
              inputmode="numeric"
              placeholder="011xxxxxxxx"
              style="
                width: 100%;
                padding: 12px 14px;
                border-radius: 12px;
                border: 1px solid #dbe2ea;
                background: #f8fafc;
                font-size: 15px;
                text-align: left;
                direction: ltr;
              "
            />
          </div>

          <div>
            <label
              for="quickActionOrderNumber"
              style="
                display: block;
                margin-bottom: 6px;
                color: #334155;
                font-size: 13px;
                font-weight: 700;
              "
            >
              رقم الطلب <span style="color: #ef4444">*</span>
            </label>
            <input
              id="quickActionOrderNumber"
              type="text"
              required
              placeholder="مثال: 1234"
              style="
                width: 100%;
                padding: 12px 14px;
                border-radius: 12px;
                border: 1px solid #dbe2ea;
                background: #f8fafc;
                font-size: 15px;
                text-align: right;
              "
            />
          </div>

          <button
            id="quickActionSubmitBtn"
            type="submit"
            style="
              border: none;
              border-radius: 12px;
              background: #4f46e5;
              color: white;
              font-weight: 800;
              font-size: 15px;
              padding: 12px 14px;
              cursor: pointer;
            "
          >
            تأكيد
          </button>
        </form>
      </div>
    </div>

    <script>
      function openQuickActionModal(action) {
        const modal = document.getElementById("quickActionModal");
        const typeInput = document.getElementById("quickActionType");
        const title = document.getElementById("quickActionTitle");
        const submitBtn = document.getElementById("quickActionSubmitBtn");
        const actionName = action === "cancel" ? "إلغاء الطلب" : "تأكيد الطلب";

        typeInput.value = action;
        title.textContent = actionName;
        submitBtn.textContent = action === "cancel" ? "إلغاء" : "تأكيد";
        submitBtn.style.background =
          action === "cancel" ? "#ef4444" : "#4f46e5";
        modal.style.display = "flex";
        setTimeout(
          () => document.getElementById("quickActionPhone").focus(),
          50,
        );
      }

      function closeQuickActionModal() {
        document.getElementById("quickActionModal").style.display = "none";
        document.getElementById("quickActionForm").reset();
      }

      async function submitQuickAction(event) {
        event.preventDefault();

        const action = document.getElementById("quickActionType").value;
        const phone = document.getElementById("quickActionPhone").value.trim();
        const orderNumber = document
          .getElementById("quickActionOrderNumber")
          .value.trim();

        if (!/^01(0|1|2|5)\d{8}$/.test(phone)) {
          alert(
            "أدخل رقم هاتف صحيحًا مكونًا من 11 رقمًا ويبدأ بـ 010 أو 011 أو 012 أو 015",
          );
          return;
        }

        if (!orderNumber) {
          alert("يرجى إدخال رقم الطلب");
          return;
        }

        try {
          const response = await fetch("/api/send-telegram", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action,
              phone,
              orderNumber,
              source: "quick-action",
            }),
          });

          const result = await response.json();
          if (!response.ok || !result.success) {
            throw new Error(result.error || "تعذر تنفيذ العملية");
          }

          alert(
            action === "cancel"
              ? "تم إرسال طلب الإلغاء بنجاح"
              : "تم إرسال تأكيد الطلب بنجاح",
          );
          closeQuickActionModal();
        } catch (error) {
          alert(error.message || "تعذر تنفيذ العملية");
        }
      }
    </script>
  </body>
</html>
